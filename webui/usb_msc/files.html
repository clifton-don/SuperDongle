<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">SuperDongle - 文件管理</title>
    <style>
        /* === 主题变量 === */
        :root {
            --primary: #0066cc;
            --primary-dark: #0052a3;
            --bg: #f5f7fa;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #333333;
            --dim: #666666;
            --hover: #f5f5f5;
            --success: #4CAF50;
            --danger: #f44336;
        }
        [data-theme="dark"] {
            --primary: #00bcd4;
            --primary-dark: #0097a7;
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --text: #f5f5f5;
            --dim: #888888;
            --hover: #242424;
            --success: #66bb6a;
            --danger: #ef5350;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }

        /* === 整体布局容器 === */
        .app-container {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        /* === 右侧侧边栏 === */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 240px;
            background: var(--card);
            padding: 20px 16px;
            border-left: 1px solid var(--border);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        
        /* === 抽屉把手 === */
        .drawer-handle {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 50px;
            background: var(--card);
            border: 1px solid var(--border);
            border-right: 0;
            border-radius: 10px 0 0 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            z-index: 101;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 12px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar.open ~ .drawer-handle { right: 240px; }
        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-align: center;
            padding: 14px 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            text-transform: uppercase;
        }
        .sidebar-item {
            margin-bottom: 20px;
        }
        .sidebar-btn {
            width: 100%;
            padding: 12px 14px;
            background: var(--hover);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: background .2s;
        }
        .sidebar-btn:hover:not(:disabled) { background: var(--border); }
        .sidebar-btn:disabled { opacity: .6; cursor: not-allowed; }
        /* === 自定义对话框样式 === */
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .dialog-overlay.show {
            opacity: 1;
        }
        .dialog-container {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
            overflow: hidden;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .dialog-overlay.show .dialog-container {
            transform: translateY(0);
        }
        .dialog-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .dialog-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }
        .dialog-body {
            padding: 20px;
        }
        .dialog-content {
            font-size: 14px;
            color: var(--dim);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .dialog-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            background: var(--hover);
            color: var(--text);
        }
        .dialog-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .dialog-footer {
            padding: 0 20px 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .mini-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mini-btn:hover {
            background: var(--hover);
        }
        .mini-btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .mini-btn.primary:hover {
            background: var(--primary-dark);
        }

        /* === 预览弹窗样式 === */
        #preview-overlay {
            background: rgba(0, 0, 0, 0.4);
        }
        
        .preview-container {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 700px;
            height: 80vh;
            max-height: 600px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        
        .dialog-overlay.show .preview-container {
            transform: translateY(0);
        }
        
        .preview-content {
            flex: 3;
            background: var(--hover);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .preview-content img,
        .preview-content video,
        .preview-content audio {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .preview-text-area {
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            background: var(--card);
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        
        .preview-unsupported {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .preview-unsupported .preview-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.6;
        }
        
        .preview-unsupported .preview-text {
            color: var(--dim);
            font-size: 14px;
        }
        
        .preview-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
        }
        
        /* === 上传弹窗样式 === */
        .upload-dialog-container {
            max-width: 450px;
        }
        
        .upload-dialog-area {
            background: var(--card);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 30px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        
        .upload-dialog-area:hover {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.05);
        }
        
        .upload-dialog-area.dragover {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.1);
        }
        
        .upload-dialog-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .upload-dialog-area input[type="file"] {
            display: none;
        }
        .upload-progress-item {
            position: relative;
            overflow: hidden;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }
        .upload-progress-item:last-child {
            border-bottom: none;
        }
        .upload-progress-bg {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            z-index: 0;
            transition: width 0.2s;
            background: rgba(0, 102, 204, 0.25);
        }
        .upload-progress-item.success .upload-progress-bg {
            background: rgba(102, 187, 106, 0.25);
        }
        .upload-progress-item.error .upload-progress-bg {
            background: rgba(239, 83, 80, 0.3);
        }
        .upload-progress-row {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upload-file-info {
            flex: 1;
            min-width: 0;
        }
        .upload-file-name {
            font-size: 13px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }
        .upload-file-meta {
            font-size: 11px;
            color: var(--dim);
            margin-top: 3px;
        }
        .upload-status-label {
            font-size: 12px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .upload-status-label.success {
            background: rgba(102, 187, 106, 0.2);
            color: var(--success);
        }
        .upload-status-label.error {
            background: rgba(239, 83, 80, 0.2);
            color: var(--danger);
        }
        
        .upload-status-label {
            background: rgba(0, 188, 212, 0.2);
            color: var(--primary);
        }
        
        .upload-status-container {
            display: flex;
            gap: 6px;
        }
        
        /* === 开关样式 === */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border);
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
        }
        input:focus + .slider {
            box-shadow: 0 0 1px var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* === 左侧主区域 === */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* === 顶部工具栏 === */
        .top-bar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            margin-bottom: 5px;
        }
        .breadcrumb-row {
            padding: 5px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }
        .breadcrumb {
            flex: 1;
            padding: 6px 12px;
            background: var(--hover);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .breadcrumb::-webkit-scrollbar {
            display: none;
        }
        .crumb {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .crumb:hover {
            background: rgba(0, 188, 212, 0.15);
            color: var(--primary);
        }
        .crumb-separator {
            color: var(--dim);
            pointer-events: none;
        }
        .toolbar-row {
            display: flex;
            align-items: center;
            padding: 6px 16px;
            gap: 12px;
            justify-content: space-between;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .toolbar-row::-webkit-scrollbar {
            display: none;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: var(--text);
        }
        .btn:hover { background: var(--hover); border-color: var(--border); }
        .btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .btn.primary:hover { background: var(--primary-dark); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.icon-btn { padding: 8px; }
        .btn.icon-btn.wide { padding: 8px 16px; }
        .btn .btn-count { font-size: 13px; margin-left: 2px; }
        .btn svg { display: inline-block; transform-origin: center; }

        /* 刷新旋转动画 */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .btn.spinning svg { animation: spin 0.5s ease-in-out 1; transform-origin: center; }

        /* 自定义tooltip */
        .custom-tooltip {
            position: fixed;
            background: var(--card);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 9999;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            max-width: 300px;
            word-wrap: break-word;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.15s, transform 0.15s;
            border: 1px solid var(--border);
        }
        .custom-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .custom-tooltip strong {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text);
        }
        .custom-tooltip br {
            display: block;
            content: '';
            margin: 2px 0;
        }

        /* 右键菜单 */
        #context-menu {
            position: fixed;
            z-index: 3000;
            background: var(--card);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: none;
            min-width: 130px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        #context-menu.visible {
            display: block;
        }
        .menu-item {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text);
            transition: background 0.12s;
            border-bottom: 1px solid var(--border);
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item:hover {
            background: rgba(0, 188, 212, 0.15);
        }
        .menu-item:active {
            background: rgba(0, 188, 212, 0.25);
        }
        .menu-item-icon {
            width: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .menu-item.disabled {
            color: var(--dim);
            cursor: not-allowed;
        }
        .menu-item.disabled:hover {
            background: transparent;
        }
        .menu-item.disabled:active {
            background: transparent;
        }

        /* 文件区域加载态 */
        .file-area.loading .file-grid { filter: brightness(0.85); opacity: 0.7; transition: all 0.3s; }

        /* === 右侧文件区域 === */
        .file-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 20px 20px;
            user-select: none;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
        }
        .file-card {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .file-card:hover {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.05);
        }
        .file-card.selected {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.1);
        }
        .file-card.drag-selected {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.1);
        }
        .file-card.drag-selected .file-checkbox {
            opacity: 1;
        }
        .file-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .file-card:hover .file-checkbox,
        .file-card.selected .file-checkbox {
            opacity: 1;
        }
        /* 框选矩形 */
        .selection-box {
            position: absolute;
            border: 2px solid var(--primary);
            background: rgba(0, 188, 212, 0.08);
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        .file-card .file-icon {
            font-size: 64px;
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .file-svg {
            width: 48px;
            height: 48px;
            vertical-align: middle;
        }
        .file-card .file-name {
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 2.8em;
        }
        .file-card .file-meta {
            font-size: 11px;
            color: var(--dim);
            margin-top: 6px;
        }

        /* === 文件卡片操作按钮 === */
        .file-actions {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .file-actions .mini-btn {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            color: var(--text);
        }
        .file-actions .mini-btn:hover { background: var(--hover); }
        .file-actions .mini-btn.download { border-color: var(--success); color: var(--success); }
        .file-actions .mini-btn.delete { border-color: var(--danger); color: var(--danger); }

        /* === 存储信息卡片 === */
        .storage-card {
            background: var(--card);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border);
        }
        .storage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .storage-label {
            font-size: 13px;
            color: var(--dim);
        }
        .storage-percent {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
        }
        .storage-bar-container {
            width: 100%;
            height: 8px;
            background: var(--hover);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .storage-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .storage-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .storage-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        .storage-key {
            color: var(--dim);
        }
        .storage-value {
            color: var(--text);
            font-weight: 500;
        }

        /* === 通用通知弹窗 === */
        .toast-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            max-width: 90vw;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 16px 20px;
            z-index: 2000;
            display: none;
            opacity: 1;
            border-left: 4px solid var(--dim);
            transition: opacity 0.5s ease;
            box-sizing: border-box;
        }
        .toast-popup.toast-success { border-left-color: var(--success); }
        .toast-popup.toast-error { border-left-color: var(--danger); }
        .toast-popup.toast-progress { border-left-color: var(--primary); }
        .toast-popup.toast-info { border-left-color: #2196F3; }
        .toast-popup.fade-out { opacity: 0; }
        .toast-popup-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 6px;
            word-break: break-all;
            white-space: normal;
        }
        .toast-popup-message {
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 10px;
            line-height: 1.4;
            word-break: break-all;
            white-space: normal;
        }
        .toast-popup-info {
            font-size: 12px;
            color: var(--dim);
            margin-bottom: 8px;
            word-break: break-all;
            white-space: normal;
        }
        .toast-popup .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--hover);
            border-radius: 3px;
            overflow: hidden;
        }
        .toast-popup .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
            transition: width 0.2s;
        }

        /* === 平板/桌面响应式 === */
        @media (min-width: 768px) {
            .toast-popup {

        };

        // 当前目录路径
        let currentDir = '';
        let isLoading = false;
        let autoRestartEnabled = true;
        let currentFileList = []; // 缓存当前文件列表

        // 页面加载
        window.onload = function() {
            // i18n 读取语言设置
            _lang = localStorage.getItem('lang') || (navigator.language.slice(0, 2) === 'zh' ? 'zh' : 'en');
            // 监听 BroadcastChannel 语言同步
            try { var bc = new BroadcastChannel('superdongle_lang'); bc.onmessage = function(e) { _lang = e.data; localStorage.setItem('lang', e.data); applyLanguage(); }; } catch(e) {}
            window.addEventListener('storage', function(e) { if (e.key === 'lang') { _lang = e.newValue; applyLanguage(); } });
            applyLanguage();

            // 读取主题设置
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.body.dataset.theme = savedTheme;
            }
            
            // 侧边栏切换
            var sidebar = document.getElementById('sidebar');
            var drawerHandle = document.getElementById('drawer-handle');
            var toggleSidebar = function() {
                var isOpen = sidebar.classList.toggle('open');
                drawerHandle.textContent = isOpen ? '▶' : '◀';
            };
            drawerHandle.onclick = toggleSidebar;
            
            // 初始化自动重启按钮显示状态
            toggleAutoRestart();

            // === 事件委托：文件卡片交互 ===
            var fileContainer = document.getElementById('file-list-container');
            var fileArea = document.querySelector('.file-area');

            // 文件列表区域拖拽上传
            fileArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                fileArea.style.outline = '2px dashed #2196F3';
            });
            fileArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                fileArea.style.outline = 'none';
            });
            fileArea.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                fileArea.style.outline = 'none';
                if (e.dataTransfer.files.length > 0) {
                    handleFilesSelect(e.dataTransfer.files);
                }
            });

            // 点击处理（复选框、卡片、文件/目录）
            fileArea.addEventListener('click', function(e) {
                var card = e.target.closest('.file-card');
                if (!card) return;

                // 长按后的点击不处理（防止双重切换）
                if (isPressHandled) {
                    isPressHandled = false;
                    e.preventDefault();
                    return;
                }

                var name = card.dataset.name;

                // 点击复选框 → 同步选中状态
                if (e.target.classList.contains('file-checkbox')) {
                    var isChecked = e.target.checked;
                    if (isChecked) {
                        if (!selectedFiles.includes(name)) {
                            selectedFiles.push(name);
                        }
                    } else {
                        selectedFiles = selectedFiles.filter(f => f !== name);
                    }
                    updateCardStyle(name);
                    updateButtons();
                    return;
                }

                // 点击卡片本身
                if (card.dataset.isDir === 'true') {
                    if (!isLoading) {
                        enterDirectory(name);   // 目录 → 进入
                    }
                } else {
                    toggleSelected(name);   // 文件 → 切换选中
                }
            });

            // 鼠标按下 → 长按检测开始
            fileContainer.addEventListener('mousedown', function(e) {
                var card = e.target.closest('.file-card');
                if (!card) return;
                var name = card.dataset.name;

                pressTimer = setTimeout(function() {
                    isPressHandled = true;
                    toggleSelected(name);
                }, 500);
            });

            // 鼠标松开 → 长按检测结束
            fileContainer.addEventListener('mouseup', function() {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            });
            fileContainer.addEventListener('mouseleave', function() {
                if (pressTimer) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            });

            // ========== 框选（Windows桌面风格） ==========
            var _dragStartX = null, _dragStartY = null, _dragSelecting = false;
            var selBox = document.getElementById('selection-box');

            fileArea.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;
                if (e.target.closest('.file-card')) return;
                if (e.target.closest('.top-bar')) return;
                if (e.target.closest('.drawer-handle')) return;
                var rect = fileArea.getBoundingClientRect();
                _dragStartX = e.clientX - rect.left;
                _dragStartY = e.clientY - rect.top;
                _dragSelecting = false;
            });

            document.addEventListener('mousemove', function(e) {
                if (_dragStartX === null) return;
                var rect = fileArea.getBoundingClientRect();
                var curX = e.clientX - rect.left;
                var curY = e.clientY - rect.top;
                var dx = curX - _dragStartX;
                var dy = curY - _dragStartY;

                if (!_dragSelecting && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                    _dragSelecting = true;
                    selBox.style.display = 'block';
                    document.querySelectorAll('.file-card').forEach(function(c) {
                        c.classList.remove('drag-selected');
                    });
                }

                if (_dragSelecting) {
                    var left = dx > 0 ? _dragStartX : curX;
                    var top = dy > 0 ? _dragStartY : curY;
                    selBox.style.left = left + 'px';
                    selBox.style.top = top + 'px';
                    selBox.style.width = Math.abs(dx) + 'px';
                    selBox.style.height = Math.abs(dy) + 'px';

                    // 实时检测卡片碰撞，更新视觉反馈
                    var selRect = selBox.getBoundingClientRect();
                    document.querySelectorAll('.file-card').forEach(function(card) {
                        var cardRect = card.getBoundingClientRect();
                        var hit = !(cardRect.left > selRect.right ||
                                    cardRect.right < selRect.left ||
                                    cardRect.top > selRect.bottom ||
                                    cardRect.bottom < selRect.top);
                        card.classList.toggle('drag-selected', hit);
                    });

                    e.preventDefault();
                }
            });

            document.addEventListener('mouseup', function(e) {
                if (_dragStartX === null) return;

                // 清除实时选中视觉
                document.querySelectorAll('.file-card').forEach(function(c) {
                    c.classList.remove('drag-selected');
                });

                if (_dragSelecting) {
                    var selRect = selBox.getBoundingClientRect();
                    var cards = document.querySelectorAll('.file-card');
                    var hitNames = [];

                    cards.forEach(function(card) {
                        var cardRect = card.getBoundingClientRect();
                        if (!(cardRect.left > selRect.right ||
                              cardRect.right < selRect.left ||
                              cardRect.top > selRect.bottom ||
                              cardRect.bottom < selRect.top)) {
                            hitNames.push(card.dataset.name);
                        }
                    });

                    if (hitNames.length > 0) {
                        if (!e.ctrlKey && !e.metaKey) {
                            selectedFiles = [];
                        }
                        hitNames.forEach(function(name) {
                            if (!selectedFiles.includes(name)) {
                                selectedFiles.push(name);
                            }
                        });
                        document.querySelectorAll('.file-card').forEach(function(c) {
                            updateCardStyle(c.dataset.name);
                        });
                        updateButtons();
                    } else if (!e.ctrlKey && !e.metaKey) {
                        selectedFiles = [];
                        updateButtons();
                        document.querySelectorAll('.file-card').forEach(function(c) {
                            updateCardStyle(c.dataset.name);
                        });
                    }
                } else {
                    // 空白区域点击（未拖拽）：清除选中

                const rect = tooltipEl.getBoundingClientRect();

                    left = e.clientX - rect.width - 16;

                if (rect.bottom > window.innerHeight - 8) {
                    top = e.clientY - rect.height - 16;
                }
                // 边界安全，防止贴边
                if (left < 8) left = 8;

                tooltipEl.style.top = top + 'px';

        // 获取安全文件名（处理重名）
        function getSafeFileName(name, existingNames, pendingNames = []) {
            let baseName = name;
            let extension = '';
            
            // 分离文件名和扩展名
            const lastDotIndex = name.lastIndexOf('.');
            if (lastDotIndex > 0) {
                baseName = name.substring(0, lastDotIndex);
                extension = name.substring(lastDotIndex);
            }
            
            // 检查是否有冲突
            let testName = name;
            let counter = 1;
            
            while (existingNames.includes(testName) || pendingNames.includes(testName)) {
                testName = `${baseName}(${counter})${extension}`;
                counter++;
            }
            
            return testName;
        }

        // 初始化上传系统

            const uploadDialogArea = document.getElementById('upload-dialog-area');

                uploadDialogArea.addEventListener('dragover', (e) => {

                    uploadDialogArea.classList.add('dragover');
                });
                uploadDialogArea.addEventListener('dragleave', () => {
                    uploadDialogArea.classList.remove('dragover');
                });
                uploadDialogArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadDialogArea.classList.remove('dragover');
                    if (e.dataTransfer.files.length > 0) {
                        handleFilesSelect(e.dataTransfer.files);
                    }
                });
            }

            // 选择文件
            if (fileInput) {
                fileInput.addEventListener('change', function() {
                    if (this.files.length > 0) {
                        handleFilesSelect(this.files);
                        this.value = '';
                    }
                });
            }

            // 点击选择文件
            if (uploadDialogArea) {
                uploadDialogArea.onclick = function() {
                    document.getElementById('file-input').click();
                };
            }
        }

            const processedFiles = [];
            const processedNames = [];
            
            // 保存当前目录的快照（避免上传过程中目录改变导致问题）
            const originalDir = currentDir;
            
            // 逐个处理文件
            for (let file of files) {
                // 获取安全的文件名
                const safeName = getSafeFileName(file.name, existingNames, processedNames);
                
                // 保存文件对象、重命名信息和原目录
                processedFiles.push({
                    originalFile: file,
                    safeName: safeName,
                    wasRenamed: safeName !== file.name,
                    targetDir: originalDir
                });
                processedNames.push(safeName);
            }
            
            // 保存处理后的文件
            pendingFiles = processedFiles;

            if (pendingFiles.length === 0) return;
            
            // 关闭上传对话框
            closeUploadDialog();
            
            // 显示进度面板
            showUploadProgressPanel();
            
            // 开始上传
            isUploading = true;
            notifyParentBusy();
            uploadFiles(pendingFiles);
        }

        // 显示上传进度面板
        function showUploadProgressPanel() {
            const panel = document.getElementById('upload-progress-panel');
            const list = document.getElementById('upload-progress-list');
            
            // 初始化进度列表
            let html = '';
            for (let i = 0; i < pendingFiles.length; i++) {
                const fileData = pendingFiles[i];
                const file = fileData.originalFile;
                const displayName = fileData.safeName;
                
                html += `
                    <div class="upload-progress-item pending" id="upload-item-${i}">
                        <div class="upload-progress-bg" style="width: 0%"></div>
                        <div class="upload-progress-row">
                            <div class="upload-file-info">
                                <div class="upload-file-name" title="${displayName}">${displayName}</div>
                                <div class="upload-file-meta">
                                    ${formatSize(file.size)} · ${t('uploadWaiting')}
                                </div>
                            </div>
                            <div class="upload-status-container" id="status-${i}">
                                ${fileData.wasRenamed ? `<span class="upload-status-label">${t('uploadRenamed')}</span>` : ''}

        // 上传文件（串行执行）
        async function uploadFiles(fileDataList) {
            uploadCancelled = false;
            const cancelBtn = document.getElementById('btn-cancel-upload');
            if (cancelBtn) cancelBtn.style.display = 'inline-block';

            // 获取当前时间戳（浏览器本地时间）
            const mtime = getCurrentTimestamp();

            let uploadedCount = 0;
            for (let i = 0; i < fileDataList.length; i++) {
                if (uploadCancelled) break;
                const fileData = fileDataList[i];
                if (await uploadSingleFile(fileData, i, mtime)) {
                    uploadedCount++;
                }
            }
            
            isUploading = false;
            notifyParentBusy();
            
            // 有文件成功写入 disk 才需要重启 MSC 让主机看到变化
            if (autoRestartEnabled && uploadedCount > 0) {
                restartMSC();
            }
            getStorageStatus();
            
            if (cancelBtn) cancelBtn.style.display = 'none';
            
            // 所有任务完成，等待2秒后自动关闭
            setTimeout(() => {
                const panel = document.getElementById('upload-progress-panel');
                panel.style.display = 'none';
            }, 2000);
        }

        // 取消上传
        function cancelUpload() {
            if (!isUploading) return;
            uploadCancelled = true;
            if (currentXhr) {
                currentXhr.abort();
            }
            pendingFiles = [];
            getFileList();
        }

        // 上传单个文件
        function uploadSingleFile(fileData, index, mtime) {
            return new Promise((resolve) => {
                const file = fileData.originalFile;
                const safeName = fileData.safeName;
                const wasRenamed = fileData.wasRenamed;
                const targetDir = fileData.targetDir;
                
                let fullPath = safeName;
                if (targetDir) {
                    fullPath = targetDir + '/' + safeName;
                }

                const itemEl = document.getElementById(`upload-item-${index}`);
                const bgEl = itemEl.querySelector('.upload-progress-bg');
                const metaEl = itemEl.querySelector('.upload-file-meta');
                const statusEl = document.getElementById(`status-${index}`);

                // 更新状态为上传中
                itemEl.classList.remove('pending', 'success', 'error');
                metaEl.textContent = `${formatSize(file.size)} · ${t('uploadPreparing')}`;
                
                // 保留重命名标签，清空其他标签
                if (wasRenamed) {
                    statusEl.innerHTML = '<span class="upload-status-label">重命名</span>';
                } else {
                    statusEl.innerHTML = '';
                }

                const xhr = new XMLHttpRequest();
                currentXhr = xhr;
                let lastLoaded = 0;
                let lastTime = Date.now();
                let smoothSpeed = 0;
                let lastUiTime = 0;

                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        const now = Date.now();
                        const timeDiff = (now - lastTime) / 1000;
                        const bytesDiff = e.loaded - lastLoaded;
                        const currentSpeed = timeDiff > 0 ? bytesDiff / timeDiff : 0;
                        smoothSpeed = smoothSpeed * 0.9 + currentSpeed * 0.1;
                        lastLoaded = e.loaded;
                        lastTime = now;

                        if (now - lastUiTime >= 300) {
                            lastUiTime = now;
                            const speedStr = smoothSpeed > 1024 * 1024 ? (smoothSpeed / (1024 * 1024)).toFixed(1) + ' MB/s' : (smoothSpeed / 1024).toFixed(0) + ' KB/s';
                            const percentComplete = (e.loaded / e.total) * 100;
                            
                            // 更新背景进度条
                            bgEl.style.width = percentComplete + '%';
                            metaEl.textContent = `${formatSize(e.loaded)} / ${formatSize(file.size)} · ${speedStr}`;
                        }
                    }
                });

                xhr.addEventListener('load', function() {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        if (data.ok) {
                            // 成功
                            itemEl.classList.add('success');
                            bgEl.style.width = '100%';
                            metaEl.textContent = formatSize(file.size);
                            
                            // 显示重命名标签 + success标签
                            if (wasRenamed) {
                                statusEl.innerHTML = '<span class="upload-status-label">重命名</span><span class="upload-status-label success">success</span>';
                            } else {
                                statusEl.innerHTML = '<span class="upload-status-label success">success</span>';
                            }
                            
                            // 刷新列表
                            getFileList();
                            currentXhr = null;
                            resolve(true);
                            return;
                        } else {
                            // 失败
                            itemEl.classList.add('error');
                            metaEl.textContent = formatSize(file.size);
                            
                            // 显示重命名标签 + error标签
                            if (wasRenamed) {
                                statusEl.innerHTML = `<span class="upload-status-label">${t('uploadRenamed')}</span><span class="upload-status-label error">${data.message || t('toastUnknownError')}</span>`;
                            } else {
                                statusEl.innerHTML = `<span class="upload-status-label error">${data.message || t('toastUnknownError')}</span>`;
                            }
                        }
                    } else {
                        itemEl.classList.add('error');
                        metaEl.textContent = formatSize(file.size);
                        
                        // 显示重命名标签 + error标签
                        if (wasRenamed) {
                            statusEl.innerHTML = `<span class="upload-status-label">${t('uploadRenamed')}</span><span class="upload-status-label error">${t('statusServerError')} ${xhr.status}</span>`;
                        } else {
                            statusEl.innerHTML = `<span class="upload-status-label error">${t('statusServerError')} ${xhr.status}</span>`;
                        }
                    }
                    currentXhr = null;
                    resolve(false);
                });

                xhr.addEventListener('error', function() {
                    itemEl.classList.add('error');
                    metaEl.textContent = formatSize(file.size);
                    
                    // 显示重命名标签 + error标签
                    if (wasRenamed) {
                        statusEl.innerHTML = '<span class="upload-status-label">重命名</span><span class="upload-status-label error">网络错误</span>';
                    } else {
                        statusEl.innerHTML = '<span class="upload-status-label error">网络错误</span>';
                    }
                    currentXhr = null;
                    resolve(false);
                });

                xhr.addEventListener('abort', function() {
                    itemEl.classList.add('error');
                    metaEl.textContent = formatSize(file.size);
                    statusEl.innerHTML = '<span class="upload-status-label error">已取消</span>';
                    currentXhr = null;
                    resolve(false);
                });

                let url = `/api/msc/upload?filename=${encodeURIComponent(fullPath)}`;
                if (mtime) {
                    url += `&mtime=${mtime}`;
                }
                xhr.open('POST', url);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                xhr.send(file);
            });
        }

                    <div class="storage-card">

                                <span class="storage-value">${formatStorageSize(data.total_mb)}</span>
                            </div>
                            <div class="storage-row">
                                <span class="storage-key">${t('storageUsed')}</span>
                                <span class="storage-value">${formatStorageSize(usedMb)}</span>

        function formatStorageSize(mb) {

                return (mb / 1024).toFixed(2) + ' GB';
            }
            return mb.toFixed(0) + ' MB';
        }

            fetch('/api/msc/status')
                .then(response => response.json())
                .then(data => {
                    _lastStorageData = data;
                    renderStorageInfo();

                    document.getElementById('sidebar-storage').innerHTML = '<div style="color: var(--danger); font-size: 12px; padding: 8px 0;">' + t('storageFetchFailed') + '</div>';

        function getFileList() {
            if (isLoading) return;
            
            isLoading = true;
            selectedFiles = [];
            updateButtons();

            // 文件区域变暗（立即）
            document.querySelector('.file-area')?.classList.add('loading');

            let url = '/api/msc/filelist';
            if (currentDir) {
                url += `?dir=${encodeURIComponent(currentDir)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    // 缓存当前文件列表
                    currentFileList = data.files || [];
                    
                    const container = document.getElementById('file-list-container');
                    if (data.files && data.files.length > 0) {
                        let html = '';
                        let directories = [];

                        data.files.forEach(file => {
                            if (file.type === 'directory') {
                                directories.push(file);
                            }
                        });

                        // 先渲染目录（过滤系统文件夹）
                        directories.forEach(dir => {
                            if (dir.name === 'System Volume Information' || dir.name === '$RECYCLE.BIN') return;
                            const timeText = formatTimestamp(dir.mtime);
                            const tooltipName = dir.name;
                            const tooltipTime = timeText;
                            const tooltipHtml = `<strong>${tooltipName}</strong><br>${tooltipTime}`;
                            html += `
                                <div class="file-card" id="file-${dir.name}" data-name="${dir.name}" data-is-dir="true" 
                                    data-tooltip="${tooltipHtml}" data-tooltip-name="${tooltipName}" data-tooltip-time="${tooltipTime}">
                                    <input type="checkbox" class="file-checkbox">
                                    <div class="file-icon">${getFileIcon(dir.name, true)}</div>
                                    <div class="file-name">${dir.name}</div>
                                </div>
                            `;
                        });

                        // 再渲染文件（过滤系统文件夹）
                        data.files.forEach(file => {
                            if (file.type !== 'directory') {
                                if (file.name === 'System Volume Information' || file.name === '$RECYCLE.BIN') return;
                                const sizeText = formatSize(file.size);
                                const timeText = formatTimestamp(file.mtime);
                                const tooltipName = file.name;
                                const tooltipSize = sizeText;
                                const tooltipTime = timeText;
                                const tooltipHtml = `<strong>${tooltipName}</strong><br>${tooltipSize}<br>${tooltipTime}`;
                                html += `
                                    <div class="file-card" id="file-${file.name}" data-name="${file.name}" data-is-dir="false"
                                        data-tooltip="${tooltipHtml}" data-tooltip-name="${tooltipName}" 
                                        data-tooltip-size="${tooltipSize}" data-tooltip-time="${tooltipTime}">
                                        <input type="checkbox" class="file-checkbox">
                                        <div class="file-icon">${getFileIcon(file.name, false)}</div>
                                        <div class="file-name">${file.name}</div>
                                    </div>
                                `;
                            }
                        });

                        container.innerHTML = html;
                    } else {
                        container.innerHTML = '<div style="grid-column: 1 / -1; color: var(--dim); text-align: center; padding: 40px;">' + t('folderEmpty') + '</div>';
                    }

                    updateCurrentPath();
                    // 重置全选按钮图标
                    document.getElementById('btn-select-all').innerHTML = '<svg height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z"/></svg>';
                })
                .catch(error => {
                    document.getElementById('file-list-container').innerHTML = '<div style="grid-column: 1 / -1; color: var(--danger); text-align: center; padding: 40px;">' + t('fileListFailed') + '</div>';
                    console.error('Error:', error);
                    // 重置全选按钮图标
                    document.getElementById('btn-select-all').innerHTML = '<svg height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z"/></svg>';
                })
                .finally(() => {
                    // 移除加载态（请求彻底完成后）
                    document.querySelector('.file-area.loading')?.classList.remove('loading');
                    isLoading = false;
                });

        // 下载选中文件
        function downloadSelectedFiles() {
            if (selectedFiles.length === 0) return;
            
            const files = [...selectedFiles];
            let smallFiles = [];
            let largeFiles = [];
            let folderCount = 0;
            let notices = [];
            
            // 分类处理文件，保持选中顺序
            for (const filename of files) {
                const card = document.getElementById(`file-${filename}`);
                if (card && card.dataset.isDir === 'true') {
                    folderCount++;
                    continue;
                }
                
                const fileInfo = currentFileList.find(f => f.name === filename);
                let fullPath = currentDir ? `${currentDir}/${filename}` : filename;
                const isLarge = fileInfo && fileInfo.size >= LARGE_FILE_THRESHOLD;
                
                const fileItem = {
                    filename, fullPath,
                    isLarge,
                    fileSize: fileInfo ? fileInfo.size : 0,
                    status: 'pending', progress: 0,
                    received: 0, total: 0,
                    lastReceived: 0, lastTime: Date.now(), smoothSpeed: 0
                };
                
                if (isLarge) {
                    largeFiles.push(fileItem);
                } else {
                    smallFiles.push(fileItem);
                }
            }
            
            // 只有文件夹的情况
            if (folderCount > 0 && smallFiles.length === 0 && largeFiles.length === 0) {
                toast('error', t('toastHint'), t('toastNoFolderDownload'));
                return;
            }
            
            // 收集提示信息
            if (folderCount > 0) notices.push(t('downloadSkippedFolders') + ' ' + folderCount + ' ' + t('toastItemsDeleted'));
            
            // 小文件在前，大文件在后
            downloadQueue = [...smallFiles, ...largeFiles];
            showDownloadProgressPanel(notices);
            
            // 开始处理下载队列，大文件会在小文件全部下载完成后触发
            // 清除上一轮大文件下载残留的 busy 状态，否则 processDownloadQueue 会直接返回
            if (isDownloading) {
                isDownloading = false;
                notifyParentBusy();
            }
            processDownloadQueue(largeFiles);
        }

        // 根据文件名获取图标
        function getFileIcon(filename, isDir) {
            if (isDir) return FILE_ICONS.dir;
            
            const ext = filename.split('.').pop().toLowerCase();
            const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'];
            const videoExts = ['mp4', 'mkv', 'avi', 'mov'];
            const audioExts = ['mp3', 'wav', 'flac'];
            const codeExts = ['js', 'html', 'css', 'c', 'cpp', 'py', 'h', 'json', 'md', 'ino'];
            const zipExts = ['zip', 'rar', '7z', 'tar', 'gz'];
            const docExts = ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'txt'];
            
            if (imgExts.includes(ext)) return FILE_ICONS.img;
            if (videoExts.includes(ext)) return FILE_ICONS.video;
            if (audioExts.includes(ext)) return FILE_ICONS.audio;
            if (codeExts.includes(ext)) return FILE_ICONS.code;
            if (zipExts.includes(ext)) return FILE_ICONS.zip;
            if (docExts.includes(ext)) return FILE_ICONS.doc;
            if (ext === 'pdf') return FILE_ICONS.pdf;
            if (ext === 'exe') return FILE_ICONS.exe;
            if (ext === 'bin') return FILE_ICONS.bin;
            
            return FILE_ICONS.file;
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 格式化时间戳（显示本地时间）- 后端UTC → -8小时 → 前端本地
        function formatTimestamp(timestamp) {
            if (!timestamp) return '';
            const utcTime = timestamp * 1000;
            const timezoneOffset = 8 * 60 * 60 * 1000; // UTC+8 时区偏移（毫秒）
            const date = new Date(utcTime - timezoneOffset); // -8小时显示本地时间
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        // 获取当前时间戳（秒）- 前端本地时间 → +8小时 → 存到后端
        function getCurrentTimestamp() {
            const localTime = Date.now();
            const timezoneOffset = 8 * 60 * 60 * 1000; // UTC+8 时区偏移（毫秒）
            return Math.floor((localTime + timezoneOffset) / 1000);
        }

    // 处理下载队列
    async function processDownloadQueue(largeFiles = []) {
        if (isDownloading || downloadQueue.length === 0) return;
        
        isDownloading = true;
        notifyParentBusy();
        downloadCancelled = false;
        const cancelBtn = document.getElementById('btn-cancel-download');
        if (cancelBtn) cancelBtn.style.display = 'inline-block';
        
        // 处理小文件
        for (let i = 0; i < downloadQueue.length; i++) {
            const item = downloadQueue[i];
            if (downloadCancelled) {
                item.status = 'cancelled';
                updateDownloadProgressUI(i, item);
                continue;
            }
            if (!item.isLarge) {
                await downloadSingleFile(i);
            }
        }
        
        // 小文件全部下载完成后，触发大文件浏览器下载
        if (!downloadCancelled && largeFiles.length > 0) {
            // 大文件走浏览器原生下载，JS 无法跟踪/中止，仅隐藏取消按钮
            if (cancelBtn) cancelBtn.style.display = 'none';
            largeFiles.forEach(item => {
                item.status = 'downloading';
                const url = `/api/msc/download?filename=${encodeURIComponent(item.fullPath)}`;
                triggerBrowserDownload(url, item.filename);
            });
            // 保持 busy 不清除，用户可通过侧边栏切走页面来清除
            setTimeout(function() {
              document.getElementById('download-progress-panel').style.display = 'none';
              downloadQueue = [];
            }, 5000);
        } else {
            isDownloading = false;
            notifyParentBusy();
            if (cancelBtn) cancelBtn.style.display = 'none';
            setTimeout(function() {
              document.getElementById('download-progress-panel').style.display = 'none';
              downloadQueue = [];
            }, 2000);
        }
    }

    // 下载单个文件（仅小文件）
    function downloadSingleFile(index) {
        return new Promise((resolve) => {
            const item = downloadQueue[index];
            
            // 小文件：XHR 进度下载
            item.status = 'connecting';
            item.lastReceived = 0;
            item.lastTime = Date.now();
            item.smoothSpeed = 0;
            updateDownloadProgressUI(index, item);
            
            const url = `/api/msc/download?filename=${encodeURIComponent(item.fullPath)}`;
            const xhr = new XMLHttpRequest();
            currentXhrDownload = xhr;
            xhr.responseType = 'blob';
            
            xhr.onprogress = (e) => {
                if (e.lengthComputable) {
                    item.total = e.total;
                    item.received = e.loaded;
                    item.progress = Math.round((e.loaded / e.total) * 100);
                    
                    const now = Date.now();
                    const timeDiff = (now - item.lastTime) / 1000;
                    if (timeDiff > 0.1) {
                        const currentSpeed = (item.received - item.lastReceived) / timeDiff;
                        item.smoothSpeed = item.smoothSpeed * 0.8 + currentSpeed * 0.2;
                        item.lastReceived = item.received;
                        item.lastTime = now;
                    }
                    
                    updateDownloadProgressUI(index, item);
                }
            };
            
            const finish = (status) => {
                if (status === 'saving' && xhr.status === 200) {
                    item.status = 'saving';
                    updateDownloadProgressUI(index, item);
                    
                    const blobUrl = URL.createObjectURL(xhr.response);
                    triggerBrowserDownload(blobUrl, item.filename);
                    URL.revokeObjectURL(blobUrl);
                    
                    item.status = 'completed';
                    item.progress = 100;
                } else {
                    item.status = status;
                }
                
                updateDownloadProgressUI(index, item);
                currentXhrDownload = null;
                resolve();
            };
            
            xhr.onload = () => finish(xhr.status === 200 ? 'saving' : 'error');
            xhr.onerror = () => finish('error');
            xhr.onabort = () => finish('cancelled');
            
            xhr.open('GET', url);
            xhr.send();
            item.status = 'downloading';
            updateDownloadProgressUI(index, item);
        });
    }

    // 取消下载
    function cancelDownload() {
        if (!isDownloading) return;
        
        downloadCancelled = true;
        if (currentXhrDownload) {
            currentXhrDownload.abort();
        }
        isDownloading = false;
        notifyParentBusy();
        var cancelBtn = document.getElementById('btn-cancel-download');
        if (cancelBtn) cancelBtn.style.display = 'none';
        setTimeout(function() {
            document.getElementById('download-progress-panel').style.display = 'none';
            downloadQueue = [];
        }, 2000);
    }

        // 自定义确认对话框
        function showConfirm(options) {
            return new Promise((resolve) => {
                const { title, content, showInput = false, defaultValue = '' } = options;
                const dialog = document.getElementById('custom-dialog');
                const dialogTitle = document.getElementById('dialog-title');
                const dialogContent = document.getElementById('dialog-content');
                const dialogInput = document.getElementById('dialog-input');
                const btnConfirm = document.getElementById('dialog-confirm');
                const btnCancel = document.getElementById('dialog-cancel');
                
                dialogTitle.textContent = title;
                dialogContent.textContent = content;
                
                if (showInput) {
                    dialogInput.style.display = 'block';
                    dialogInput.value = defaultValue;
                    dialogInput.focus();
                } else {
                    dialogInput.style.display = 'none';
                }
                
                dialog.style.display = 'flex';
                setTimeout(() => {
                    dialog.classList.add('show');
                }, 10);
                
                let resolved = false;
                
                function handleConfirm() {
                    if (resolved) return;
                    resolved = true;
                    const result = showInput ? dialogInput.value : true;
                    closeDialog(() => resolve(result));
                }
                
                function handleCancel() {
                    if (resolved) return;
                    resolved = true;
                    closeDialog(() => resolve(null));
                }
                
                function closeDialog(callback) {
                    dialog.classList.remove('show');
                    setTimeout(() => {
                        dialog.style.display = 'none';
                        if (callback) callback();
                    }, 300);
                }
                
                btnConfirm.onclick = handleConfirm;
                btnCancel.onclick = handleCancel;
                
                // 点击遮罩层关闭
                dialog.onclick = function(e) {
                    if (e.target === dialog) {
                        handleCancel();
                    }
                };
                
                // 按 ESC 键关闭
                document.addEventListener('keydown', function escHandler(e) {
                    if (e.key === 'Escape') {
                        handleCancel();
                        document.removeEventListener('keydown', escHandler);
                    }
                });
            });
        }

        // 修改重命名函数
        async function renameFile() {
            if (selectedFiles.length !== 1) return;
            
            const oldName = selectedFiles[0];
            const fileCard = document.getElementById(`file-${oldName}`);
            const isDir = fileCard?.dataset.isDir === 'true';
            
            // 步骤1: 获取新名称
            let newName = await showConfirm({
                title: t('commonRename'),
                content: '请输入新名称:',
                showInput: true,
                defaultValue: oldName
            });
            
            if (!newName || newName === oldName) return;
            if (/[\\/:*?"<>|]/.test(newName)) {
                toast('error', t('toastInvalidName'), t('toastInvalidFileNameMsg'));
                return;
            }
            
            // 步骤2: 如果是文件夹，直接跳到步骤4
            if (isDir) {
                // 直接执行重命名
                await performRename(oldName, newName);
                return;
            }
            
            // 步骤3: 是文件，执行后缀保护逻辑
            // 分离原文件名的主文件名和后缀名
            let originalBaseName = oldName;
            let originalExtension = '';
            const lastDotIndex = oldName.lastIndexOf('.');
            if (lastDotIndex > 0) {
                originalBaseName = oldName.substring(0, lastDotIndex);
                originalExtension = oldName.substring(lastDotIndex);
            }
            
            // 自动补全逻辑：如果用户输入不包含点号，自动拼上原始后缀
            const newNameHasDot = newName.includes('.');
            if (!newNameHasDot && originalExtension) {
                newName = newName + originalExtension;
            }
            
            // 检查后缀是否变更
            if (newNameHasDot && originalExtension) {
                const newLastDotIndex = newName.lastIndexOf('.');
                const newExtension = newName.substring(newLastDotIndex);
                
                if (newExtension.toLowerCase() !== originalExtension.toLowerCase()) {
                    // 添加延迟保护，避免DOM渲染冲突
                    await new Promise(r => setTimeout(r, 100));
                    
                    // 后缀变更，提示用户确认
                    const confirmChange = await showConfirm({
                        title: '警告',
                        content: '检测到扩展名变更，这可能导致文件无法打开，确定要修改吗？'
                    });
                    
                    if (!confirmChange) {
                        return;
                    }
                }
            }
            
            // 步骤4: 执行重命名操作
            await performRename(oldName, newName);
        }

                    if (autoRestartEnabled) {
                        restartMSC();

            } finally {

            }
        }

        async function loadMoveDirList() {
            const listEl = document.getElementById('move-dir-list');
            const pathBar = document.getElementById('move-path-bar');
            listEl.innerHTML = '<div style="text-align:center;color:var(--dim);padding:20px;">' + t('moveLoading') + '</div>';

             if (moveDir) {
                 const parts = moveDir.split('/');
                 let accum = '';
                 for (const part of parts) {
                     accum = accum ? accum + '/' + part : part;
                     pathHtml += ' <span style="color:var(--dim);flex-shrink:0;">›</span> <span style="cursor:pointer;color:var(--primary);flex-shrink:0;" onclick="moveNavigateTo(\'' + accum + '\')">' + part + '</span>';
                 }
             }
            pathBar.innerHTML = pathHtml;

            // 获取目录列表
            let url = '/api/msc/filelist';
            if (moveDir) url += '?dir=' + encodeURIComponent(moveDir);

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                const files = data.files || [];
                const dirs = files.filter(f => f.type === 'directory' && f.name !== 'System Volume Information');

                if (dirs.length === 0) {
                    listEl.innerHTML = '<div style="text-align:center;color:var(--dim);padding:20px;">' + t('moveNoSubfolder') + '</div>';
                    return;
                }

                let html = '';
                dirs.forEach(dir => {
                    const subDir = moveDir ? moveDir + '/' + dir.name : dir.name;
                    const safeSubDir = subDir.replace(/'/g, "\\'");
                    html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 8px;cursor:pointer;border-radius:4px;font-size:14px;color:var(--text);" ' +
                        'onmouseenter="this.style.background=\'var(--hover)\'" onmouseleave="this.style.background=\'transparent\'" ' +
                        'onclick="moveNavigateTo(\'' + safeSubDir + '\')">' +
                        '📁 ' + dir.name + '</div>';
                });
                listEl.innerHTML = html;
            } catch (e) {
                listEl.innerHTML = '<div style="text-align:center;color:var(--danger);padding:20px;">' + t('moveLoadFailed') + '</div>';
            }
        }

        async function executeMove() {
            if (selectedFiles.length === 0) return;
            const targetDir = moveTargetDir !== undefined ? moveTargetDir : '';
            
            if (targetDir === currentDir) {
                toast('error', t('toastMoveFailed'), t('toastMoveToCurrentDir'));
                return;
            }

            const resp = await fetch('/api/msc/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    files: [...selectedFiles],
                    sourceDir: currentDir,
                    targetDir: targetDir
                })
            });

            const data = await resp.json();
            if (data.ok) {
                toast('success', t('toastMoveSuccess'), data.moved + ' ' + t('toastItemsMoved'));
                selectedFiles = [];
                updateButtons();
                if (autoRestartEnabled) restartMSC();
                getFileList();
            } else {
                toast('error', t('toastMoveFailed'), data.message || t('toastOperationFailed'));
            }
        }

        // i18n 应用语言翻译
        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
                el.title = t(el.dataset.i18nTitle);
            });
            if (document.querySelector('title[data-i18n]')) {
                document.title = t(document.querySelector('title').dataset.i18n);
            }
            if (typeof updateCurrentPath === 'function') {
                updateCurrentPath();
            }
            if (typeof renderStorageInfo === 'function') {
                renderStorageInfo();
            }
        }
    </script>
